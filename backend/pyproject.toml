[project]
name = "whisky-discovery-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "temporalio>=1.20",
    "pyjwt[crypto]>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.3,<4",
    "ag-ui-protocol==0.1.22",
    "pydantic-ai-slim[openai,temporal]==2.51.0",
    "aiohttp>=3.13,<4",
]

[project.scripts]
whisky-api = "whisky.bootstrap.api:main"
whisky-worker = "whisky.bootstrap.worker:main"
whisky-migrate = "whisky.bootstrap.migrate:main"
whisky-catalog-publish = "whisky.bootstrap.catalog:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisky"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "whisky/migrations"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.12", "mypy>=1.15", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires real isolated PostgreSQL or Temporal"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
