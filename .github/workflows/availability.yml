name: Public availability

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/availability.yml
      - scripts/check_public_health.py

permissions:
  contents: read

concurrency:
  group: whisky-public-availability
  cancel-in-progress: false

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_health.py
